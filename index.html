<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Deep°style - Advanced Responsive Grid</title>

      <meta
         name="description"
         content="Discover the Summer Collection at Deep°style. Make your fashion look more charming with our trendy and classy new season arrivals."
      />
      <meta name="keywords" content="fashion, summer collection, trendy clothes, Deep style, bento grid fashion" />
      <meta name="author" content="Josh Luchbovic" />
      <meta name="theme-color" content="#ffffff" />

      <meta property="og:title" content="Deep°style - Summer Collection" />
      <meta property="og:description" content="Explore the latest trendy and classy fashion for the new season." />
      <meta property="og:type" content="website" />

      <!-- SEO & Web Vitals Optimizations (2026 Standards) -->
      <link rel="canonical" href="https://www.deepstyle.com/" />
      <link rel="preload" as="image" href="assets/images/Center Hero.avif" fetchpriority="high" />

      <!-- Website Favicon -->
      <link rel="icon" type="image/jpeg" href="assets/favicon.jpg" />

      <link rel="stylesheet" href="style.css" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500&family=Manrope:wght@200;300;400;500&family=Outfit:wght@100;200;300;400;500&family=Allura&family=Sacramento&family=Questrial&display=swap"
         rel="stylesheet"
      />
   </head>
   <body>
      <!-- Header / Navigation -->
      <header class="main-header">
         <div class="logo" aria-label="Deep style logo">Deep<span class="degree">°</span>style</div>

         <!-- Modern HTML Popover for Mobile Menu -->
         <button type="button" class="hamburger-btn" popovertarget="nav-links" aria-label="Toggle mobile menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
         </button>

         <nav id="nav-links" popover="auto" class="nav-links" aria-label="Primary navigation">
            <a href="#">New Arrivals</a>
            <a href="#">Shop</a>
            <a href="#">Beauty</a>
            <a href="#">Sale</a>
            <a href="#">Journal</a>
         </nav>
         <div class="header-actions">
            <button type="button" class="icon-btn search-icon" aria-label="Search">
               <img src="assets/svg/Search.svg" class="icon" alt="" aria-hidden="true" />
            </button>
            <button type="button" class="icon-btn user-icon" aria-label="User Profile">
               <img src="assets/svg/User.svg" class="icon" alt="" aria-hidden="true" />
            </button>
            <button type="button" class="cart-btn" aria-label="Shopping Cart">
               <img
                  src="assets/svg/Cart.svg"
                  alt=""
                  aria-hidden="true"
                  style="width: 1.125rem; height: 1.125rem; filter: brightness(0) invert(1)"
               />
            </button>
         </div>
      </header>

      <main class="content-wrapper">
         <img
            src="assets/svg/sunflower.svg"
            width="60"
            height="60"
            class="sticker sticker-sunflower"
            alt=""
            aria-hidden="true"
            role="presentation"
         />
         <img
            src="assets/svg/Pink Hibiscus.svg"
            width="60"
            height="60"
            class="sticker sticker-hibiscus"
            alt=""
            aria-hidden="true"
            role="presentation"
         />

         <!-- Main Top Heading -->
         <h1 id="main-grid-title" class="main-heading">
            M<span class="font-a">a</span>ke Your F<span class="font-a">a</span>shion Look<br />More Ch<span
               class="font-a"
               >a</span
            >rming
         </h1>

         <!-- The 5-Column Natural Masonry Flow -->
         <section class="bento-container" aria-labelledby="main-grid-title">
            <!-- Column 1 (Text block on top, then Yellow Cap) -->
            <div class="grid-col col-1">
               <header class="left-text-block">
                  <p class="subtitle">Summer Collection</p>
                  <h2 class="sub-heading">TRENDY AND<br />CLASSY FOR<br />NEW SEASON</h2>
               </header>

               <figure class="bento-item">
                  <img
                     src="assets/images/Far-Left.avif"
                     width="400"
                     height="300"
                     alt="Model wearing yellow cap"
                     class="model-img"
                     loading="lazy"
                     decoding="async"
                  />
               </figure>

               <figure class="quote-block">
                  <img src="assets/svg/quote.svg" width="56" height="38" class="quote-mark" alt="" aria-hidden="true" />
                  <blockquote>
                     <p>
                        I'm very much of the 'buy less but buy<br />better' philosophy. It's what I've never really knew
                     </p>
                  </blockquote>
                  <figcaption class="signature-wrapper">
                     <span class="signature">Josh Luchbovic</span>
                     <span class="orange-dash" aria-hidden="true"></span>
                  </figcaption>
               </figure>
            </div>

            <!-- Column 2 (Striped Shirt, G-Cap) -->
            <div class="grid-col col-2">
               <img
                  src="assets/svg/Yellow Daisy.svg"
                  width="60"
                  height="60"
                  class="sticker sticker-daisy"
                  alt=""
                  aria-hidden="true"
                  role="presentation"
               />
               <figure class="bento-item">
                  <img
                     src="assets/images/Top Middle-Left.avif"
                     width="400"
                     height="500"
                     alt="Model in striped shirt"
                     class="model-img"
                     loading="lazy"
                     decoding="async"
                  />
               </figure>
               <figure class="bento-item">
                  <img
                     src="assets/images/Bottom Middle-Left.avif"
                     width="400"
                     height="300"
                     alt="Model in G-cap"
                     class="model-img"
                     loading="lazy"
                     decoding="async"
                  />
               </figure>
            </div>

            <!-- Column 3 (Center Hero - Pink Shirt) - LCP Image so NO lazy loading -->
            <div class="grid-col col-3">
               <img
                  src="assets/svg/Black Asterisk.svg"
                  width="60"
                  height="60"
                  class="graphic asterisk"
                  alt=""
                  aria-hidden="true"
                  role="presentation"
               />
               <figure class="bento-item hero-item">
                  <!-- Not lazy loading the LCP (Largest Contentful Paint) image -->
                  <img
                     src="assets/images/Center Hero.avif"
                     width="400"
                     height="600"
                     alt="Hero Model wearing pink and blue shirt"
                     class="model-img"
                     fetchpriority="high"
                  />
               </figure>
            </div>

            <!-- Column 4 (Purple Hoodie, Blue BG) -->
            <div class="grid-col col-4">
               <figure class="bento-item">
                  <img
                     src="assets/images/Top Middle-Right.avif"
                     width="400"
                     height="500"
                     alt="Model in purple hoodie"
                     class="model-img"
                     loading="lazy"
                     decoding="async"
                  />
               </figure>
               <figure class="bento-item">
                  <img
                     src="assets/images/Bottom Middle-Right.avif"
                     width="400"
                     height="400"
                     alt="Model with blue background"
                     class="model-img"
                     loading="lazy"
                     decoding="async"
                  />
               </figure>
            </div>

            <!-- Column 5 (Explore Circle, Red Beanie) -->
            <div class="grid-col col-5">
               <button type="button" class="explore-circle" aria-label="Explore more collection video">
                  <svg class="text-circle" viewBox="0 0 100 100" aria-hidden="true">
                     <path
                       fill="none"
                       id="circlePath"
                       stroke="var(--text-primary)"
                       stroke-width="1.5"
                       stroke-linecap="round"
                       transform="translate(0, 3)"
                       d="M 31.9 99.8 A 53 53 0 0 0 72.1 99.8"
                     />
                     <path id="textPath" fill="none" d="M 49.54,103.00 A 53,53 0 1,1 50.46,103.00" />
                     <text
                        font-family="'Plus Jakarta Sans', sans-serif"
                        font-size="15.8"
                        font-weight="500"
                        letter-spacing="1.7px"
                        fill="var(--text-primary)"
                        text-anchor="middle"
                        dominant-baseline="central"
                     >
                        <textPath href="#textPath" startOffset="50%">
                           EXPLORE&nbsp;&nbsp;MORE&nbsp;&nbsp;COLLECTION
                        </textPath>
                     </text>
                  </svg>
                  <svg class="play-btn" viewBox="0 0 24 24" fill="black" aria-hidden="true">
                     <path d="M9 6v12l10-6z" />
                  </svg>
               </button>
               <figure class="bento-item">
                  <img
                     src="assets/images/Far-Right.avif"
                     width="400"
                     height="500"
                     alt="Model in red beanie"
                     class="model-img"
                     loading="lazy"
                     decoding="async"
                  />
               </figure>
               <div class="hashtag" aria-label="Trending hashtag 2022">#2022</div>
            </div>
         </section>

         <!-- Bottom Controls -->
         <footer class="bottom-controls">
            <!-- Floating Pill -->
            <div style="position: relative">
               <img
                  src="assets/svg/Pink Blossom.svg"
                  width="60"
                  height="60"
                  class="sticker sticker-blossom"
                  alt=""
                  aria-hidden="true"
                  role="presentation"
               />
               <button type="button" class="scroll-pill" aria-label="Scroll down">
                  <span>SCROLL DOWN</span>
                  <img src="assets/svg/chevron.svg" alt="" aria-hidden="true" class="chevron-icon" />
               </button>
            </div>

            <!-- Right pagination -->
            <nav class="pagination" aria-label="Blog pagination">
               <div class="beige-slash" aria-hidden="true"></div>
               <div class="page-num" aria-label="Page 1">01</div>
               <div class="page-text">
                  <p class="date"><time datetime="2022-05-31">31 May 2022</time> • Blog</p>
                  <h3 class="title">Always be strong<br />and have values</h3>
               </div>
               <div style="position: relative">
                  <img
                     src="assets/svg/Drooping Rose.svg"
                     width="60"
                     height="60"
                     class="sticker sticker-rose"
                     alt=""
                     aria-hidden="true"
                     role="presentation"
                  />
                  <button type="button" class="next-arrow-btn" aria-label="Next page">
                     <img src="assets/svg/Arrow.svg" alt="" aria-hidden="true" class="next-icon" />
                  </button>
               </div>
            </nav>
         </footer>
      </main>
   </body>
</html>
